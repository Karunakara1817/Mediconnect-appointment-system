server:
  port: ${PORT:8080}

spring:
  application:
    name: mediconnect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediconnect_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:bWVkaWNvbm5lY3RTZWNyZXRLZXlGb3JKV1RBdXRoZW50aWNhdGlvbjIwMjZTZWN1cmU=}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:5000}
