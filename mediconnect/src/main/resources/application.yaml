server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediconnect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_local_password}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:mediconnect_default_local_secret_key_change_in_prod_123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:5000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
